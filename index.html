<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Random Media</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <div class="media-wrapper">
      <img id="random-image" class="hidden" src="" alt="Random artwork" />
      <video id="random-video" class="hidden" muted playsinline></video>
    </div>
    <button id="btn-understand" class="btn-understand" type="button">I Understand</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
