name: Update Manifest

on:
  push:
    paths:
      - 'assets/images/**'
      - 'assets/audio/**'
      - 'assets/videos/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          python3 -c "
          import os, json

          img_exts = {'.jpg', '.jpeg', '.png', '.webp', '.gif'}
          aud_exts = {'.mp3', '.wav', '.ogg', '.opus'}
          vid_exts = {'.mp4', '.webm', '.mov'}

          def scan(folder, exts):
              if not os.path.isdir(folder):
                  return []
              return sorted([
                  folder + '/' + f
                  for f in os.listdir(folder)
                  if os.path.splitext(f)[1].lower() in exts
              ])

          manifest = {
              'images': scan('assets/images', img_exts),
              'audio':  scan('assets/audio', aud_exts),
              'videos': scan('assets/videos', vid_exts),
          }

          with open('manifest.json', 'w', encoding='utf-8') as fh:
              json.dump(manifest, fh, indent=2, ensure_ascii=False)

          print(f'Manifest: {len(manifest[\"images\"])} images, {len(manifest[\"audio\"])} audio, {len(manifest[\"videos\"])} videos')
          "

          echo "Generated manifest.json:"
          cat manifest.json

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "No changes to manifest.json"
          else
            git commit -m "chore: auto-update manifest.json"
            git push
          fi
