name: Update Manifest

on:
  push:
    paths:
      - 'assets/images/**'
      - 'assets/audio/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          python3 -c "
          import os, json

          img_exts = {'.jpg', '.jpeg', '.png', '.webp', '.gif'}
          aud_exts = {'.mp3', '.wav', '.ogg'}

          images = sorted([
              'assets/images/' + f
              for f in os.listdir('assets/images')
              if os.path.splitext(f)[1].lower() in img_exts
          ])

          audio = sorted([
              'assets/audio/' + f
              for f in os.listdir('assets/audio')
              if os.path.splitext(f)[1].lower() in aud_exts
          ])

          with open('manifest.json', 'w', encoding='utf-8') as fh:
              json.dump({'images': images, 'audio': audio}, fh, indent=2, ensure_ascii=False)

          print(f'Manifest: {len(images)} images, {len(audio)} audio')
          "

          echo "Generated manifest.json:"
          cat manifest.json

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "No changes to manifest.json"
          else
            git commit -m "chore: auto-update manifest.json"
            git push
          fi
