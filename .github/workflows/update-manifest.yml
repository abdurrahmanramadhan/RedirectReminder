name: Update Manifest

on:
  push:
    paths:
      - 'assets/images/**'
      - 'assets/audio/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          echo '{' > manifest.json

          # Scan images
          echo '  "images": [' >> manifest.json
          FIRST=true
          for file in $(find assets/images -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' -o -iname '*.gif' \) | sort); do
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo ',' >> manifest.json
            fi
            printf '    "%s"' "$file" >> manifest.json
          done
          echo '' >> manifest.json
          echo '  ],' >> manifest.json

          # Scan audio
          echo '  "audio": [' >> manifest.json
          FIRST=true
          for file in $(find assets/audio -type f \( -iname '*.mp3' -o -iname '*.wav' -o -iname '*.ogg' \) | sort); do
            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo ',' >> manifest.json
            fi
            printf '    "%s"' "$file" >> manifest.json
          done
          echo '' >> manifest.json
          echo '  ]' >> manifest.json

          echo '}' >> manifest.json

          echo "Generated manifest.json:"
          cat manifest.json

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "No changes to manifest.json"
          else
            git commit -m "chore: auto-update manifest.json"
            git push
          fi

